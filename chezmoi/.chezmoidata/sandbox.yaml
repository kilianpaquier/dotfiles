sandbox:
  host:
    allow_read:
      # Git configuration (signing, aliases, etc.)
      - ~/.ssh/id_ed25519.pub
      - ~/.config/git
      - ~/.gitconfig

      # Binaries accesses
      - ~/.local/bin
      - ~/.local/state/nix

      # RC files
      - ~/.bash_aliases
      - ~/.bashenv
      - ~/.bashrc
      - ~/.env.zsh
      - ~/.profile
      - ~/.zprofile
      - ~/.zshrc

      # Mise binaries accesses
      - ~/.config/mise/conf.d
      - ~/.config/mise/config.toml
      - ~/.config/mise/miserc.toml
      - ~/.local/share/mise

      # Claude harness
      - ~/.claude.json
      - ~/.claude/agents
      - ~/.claude/CLAUDE.md
      - ~/.claude/plugins
      - ~/.claude/RTK.md
      - ~/.claude/rules
      - ~/.claude/settings.json
      - ~/.claude/skills

      # Copilot harness
      - ~/.copilot/agents
      - ~/.copilot/copilot-instructions.md
      - ~/.copilot/hooks
      - ~/.copilot/installed-plugins
      - ~/.copilot/instructions
      - ~/.copilot/lsp-config.json
      - ~/.copilot/settings.json
      - ~/.copilot/skills
    deny_read:
      - "~"
      - /run/user # block sockets
    allow_write:
      - "."
      - ~/workspaces

      # Claude harness
      - ~/.claude/plans
      - ~/.claude/session-env

      # Copilot harness
    deny_write: []

  full:
    allow_read: []
    allow_write: []

  # Network constraints
  network:
    allow_domains:
      - "*.githubcopilot.com"
      - "*.k8s.io"
