sandbox:
  # Paths every sandbox reads (srt allows them, sbx and openshell copy them into the sandbox)
  read:
    # Git configuration (signing, aliases, etc.)
    - ~/.config/git
    - ~/.gitconfig
    - ~/.ssh/id_ed25519.pub

    # Mise configuration
    - ~/.config/mise/conf.d
    - ~/.config/mise/config.toml

    # Claude harness
    - ~/.claude/RTK.md
    - ~/.claude/agents
    - ~/.claude/hooks
    - ~/.claude/rules
    - ~/.claude/skills

    # Copilot harness
    - ~/.copilot/agents
    - ~/.copilot/copilot-instructions.md
    - ~/.copilot/hooks
    - ~/.copilot/instructions
    - ~/.copilot/lsp-config.json
    - ~/.copilot/mcp-config.json
    - ~/.copilot/settings.json
    - ~/.copilot/skills

    # Agent Skills (opencode, pi)
    - ~/.agents/skills

    # OpenCode harness
    - ~/.config/opencode/agents
    - ~/.config/opencode/cli.json
    - ~/.config/opencode/commands
    - ~/.config/opencode/opencode.json
    - ~/.config/opencode/plugins
    - ~/.config/opencode/skills

    # Pi harness
    - ~/.pi/agent/extensions
    - ~/.pi/agent/keybindings.json
    - ~/.pi/agent/mcp.json
    - ~/.pi/agent/models.json
    - ~/.pi/agent/prompts
    - ~/.pi/agent/skills
    - ~/.pi/agent/trust.json

  # Paths only srt reads, since it runs host binaries in place and an image would keep a copy of the login files
  read_local:
    # Binaries accesses
    - ~/.bun
    - ~/.local/bin
    - ~/.local/lib
    - ~/.local/share/mise
    - ~/.local/share/uv
    - ~/.local/state/nix
    # - ~/.cache/mise

    # Claude harness
    - ~/.claude.json

    # Copilot harness
    - ~/.copilot/config.json

  # Paths only the shared kernel sandboxes read, since sbx seeds these files itself
  read_host:
    # Claude harness
    - ~/.claude/CLAUDE.md
    - ~/.claude/plugins
    - ~/.claude/settings.json

    # Copilot harness
    - ~/.copilot/.cache
    - ~/.copilot/extensions
    - ~/.copilot/installed-plugins
    - ~/.copilot/permissions-config.json
    - ~/.copilot/plugin-data
    - ~/.copilot/servers

    # Pi harness
    - ~/.pi/agent/git
    - ~/.pi/agent/npm
    - ~/.pi/agent/settings.json

    # RC files
    # - ~/.bash_aliases
    # - ~/.bash_logout
    # - ~/.bashenv
    # - ~/.bashrc
    # - ~/.env.zsh
    # - ~/.p10k.zsh
    # - ~/.profile
    # - ~/.zlogout
    # - ~/.zprofile
    # - ~/.zshenv
    # - ~/.zshrc

    # RC directories
    # - ~/.cache/zsh
    # - ~/.cache/zsh4humans

  # Paths only the shared kernel sandboxes write, since the other sandboxes make their whole home writable
  write:
    - "."
    - ~/workspaces
    - /tmp/claude

    # Claude harness
    - ~/.claude/debug
    - ~/.claude/plans
    - ~/.claude/session-env

    # Copilot harness
    - ~/.copilot/command-history-state
    - ~/.copilot/ide
    - ~/.copilot/logs
    - ~/.copilot/session-state
    - ~/.copilot/sidebar-session-state

    # OpenCode harness
    - ~/.cache/opencode
    - ~/.local/share/opencode
    - ~/.local/state/opencode

    # Pi harness
    - ~/.pi/agent/mcp.log
    - ~/.pi/agent/sessions
    - ~/.pi/agent/tmp

  # Paths the shared kernel sandboxes deny
  deny_read:
    - /boot
    - /efi
    - /home
    - /media
    - /mnt
    - /root
    - /run/credentials
    - /run/secrets
    - /run/user
    - /var/lib/private
    - /var/log
    - /var/run/credentials
  deny_write: []

  # Network constraints
  network:
    allow_domain:
      - "*.githubcopilot.com"
      - "*.k8s.io"
      - "*.kubernetes.io"
      - aaif.io
      - agent-plugins.org
      - agentsview.io
      - ai.kilianpaquier.dev
