# Code generated by AI (Claude Code)

# Paths the host sandboxes (nono, srt) grant the agents.
sandbox:
  # Project roots, read-write and kept in nono rollback snapshots.
  # The chezmoi source is listed entry by entry without symlinks/, since Landlock can't deny the shell configs it holds under a granted dir.
  workspaces:
    - ~/.local/share/chezmoi/.git
    - ~/.local/share/chezmoi/chezmoi
    - ~/.local/share/chezmoi.worktrees
    - ~/workspaces
  # Tool caches and state, read-write and left out of nono rollback snapshots.
  write_dirs:
    - ~/.bun/install/cache
    - ~/.cache/chroma
    - ~/.cache/dcg
    - ~/.cache/gh
    - ~/.cache/glab-cli
    - ~/.cache/go-build
    - ~/.cache/go/pkg
    - ~/.cache/goimports
    - ~/.cache/golangci-lint
    - ~/.cache/gopls
    - ~/.cache/helm
    - ~/.cache/huggingface
    - ~/.cache/hugo_cache
    - ~/.cache/mise
    - ~/.cache/pip
    - ~/.cache/pre-commit
    - ~/.cache/terraform
    - ~/.cache/tflint
    - ~/.cache/typescript
    - ~/.cache/uv
    - ~/.cache/virtualenv
    - ~/.codegraph
    - ~/.gradle/caches
    - ~/.gradle/wrapper
    - ~/.kotlin
    - ~/.local/share/rtk
    - ~/.local/state/dcg
    - ~/.local/state/gh
    - ~/.m2/repository
    - ~/.mempalace
    - ~/.npm
  write_files:
    - ~/.local/share/chezmoi/AGENTS.md
    - ~/.local/share/chezmoi/CHANGELOG.md
    - ~/.local/share/chezmoi/README.md
  read_dirs:
    - ~/.bun/bin
    - ~/.config/chezmoi
    - ~/.config/dcg
    - ~/.config/gh
    - ~/.config/git
    - ~/.config/glab-cli
    - ~/.config/go
    - ~/.config/mise/conf.d
    - ~/.config/rtk
    - ~/.krew
    - ~/.local/bin
    - ~/.local/share/mise
    - ~/.local/share/uv
    - ~/.local/state/chezmoi
    - ~/.local/state/mise
    - ~/.local/state/nix
  read_files:
    - ~/.config/mise/config.toml
    - ~/.config/mise/miserc.toml
    - ~/.gitconfig
    - ~/.terraformrc
  # Hosts the agents reach without asking in srt and in the sbx tools kit, and the SSH hosts and ports they never reach.
  network:
    allow:
      - "*.githubcopilot.com"
      - "*.k8s.io"
      - "*.kubernetes.io"
      - aaif.io
      - agent-plugins.org
      - agentsview.io
