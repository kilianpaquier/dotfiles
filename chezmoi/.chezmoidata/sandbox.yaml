  # Per agent: its harness read-only, listed below its home since srt binds a read directory over the write directories under it, and only the state it writes read-write.
  agents:
    claude:
      read:
        - ~/.claude/agents
        - ~/.claude/plugins
        - ~/.claude/rules
        - ~/.claude/skills
      read_files:
        - ~/.claude/CLAUDE.md
        - ~/.claude/RTK.md
        - ~/.claude/settings.json
      write:
        - ~/.cache/claude-cli-nodejs
        - ~/.claude/.cc-writes
        - ~/.claude/backups
        - ~/.claude/cache
        - ~/.claude/debug
        - ~/.claude/file-history
        - ~/.claude/ide
        - ~/.claude/logs
        - ~/.claude/paste-cache
        - ~/.claude/plans
        - ~/.claude/projects
        - ~/.claude/session-env
        - ~/.claude/sessions
        - ~/.claude/shell-snapshots
        - ~/.claude/state
        - ~/.claude/statsig
        - ~/.claude/todos
      write_files:
        - ~/.claude.json
        - ~/.claude/.credentials.json
        - ~/.claude/.last-cleanup
        - ~/.claude/history.jsonl
        - ~/.claude/mcp-needs-auth-cache.json
    codex:
      read:
        - ~/.agents/skills
        - ~/.codex/plugins/cache
      read_files:
        - ~/.codex/AGENTS.md
        - ~/.codex/RTK.md
        - ~/.codex/config.toml
        - ~/.codex/hooks.json
      write:
        - ~/.codex/archived_sessions
        - ~/.codex/log
        - ~/.codex/memories
        - ~/.codex/sessions
        - ~/.codex/sqlite
      write_files:
        - ~/.codex/auth.json
        - ~/.codex/history.jsonl
    # Writable as a whole, since SQLite creates files at the root of ~/.copilot, with the harness denied for writes in srt (nono can't deny inside a writable directory).
    copilot:
      read: []
      read_files: []
      write:
        - ~/.cache/copilot
        - ~/.copilot
      write_files: []
      deny_write:
        - ~/.copilot/agents
        - ~/.copilot/copilot-instructions.md
        - ~/.copilot/hooks
        - ~/.copilot/installed-plugins
        - ~/.copilot/instructions
        - ~/.copilot/lsp-config.json
        - ~/.copilot/settings.json
        - ~/.copilot/skills
