agent_runtimes: [claude, codex, copilot]

managers: [mise, brew]

bundles:
  mise:
    default: [context7, destructive-command-guard, git-tools, go, hugo, rtk, shell, uv]
    available:
      - bun
      - cavemem
      - codebase-memory-mcp
      - codegraph
      - context7
      - destructive-command-guard
      - git-tools
      - gitlab-ci-local
      - go
      - graphify
      - hugo
      - incus
      - java
      - just
      - k6
      - k8s
      - kotlin
      - mempalace
      - opentofu
      - pnpm
      - rtk
      - shell
      - task
      - terraform
      - typescript
      - uv
      - yarn
  brew:
    default: [destructive-command-guard, git-tools, go, hugo, rtk, shell, uv]
    available:
      - bun
      - destructive-command-guard
      - git-tools
      - gitlab-ci-local
      - go
      - hugo
      - incus
      - java
      - just
      - k6
      - k8s
      - kotlin
      - opentofu
      - rtk
      - shell
      - task
      - terraform
      - typescript
      - uv

default_managers: [mise]

profiles:
  home:
    default_tools: [bun, incus, opentofu]
  soprasteria:
    default_tools: [java, k6, k8s, terraform]

plugins:
  default: [caveman, ponytail]
  available: [caveman, ponytail]
