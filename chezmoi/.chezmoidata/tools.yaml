machines: [desktop, server, workstation]
profiles: [home, soprasteria]

managers: [mise]
default_managers:
  home: [mise]
  soprasteria: [mise]

container_runtimes: [docker, podman]
default_container_runtimes:
  home: [podman]
  soprasteria: [podman]

tools:
  mise:
    - boost
    - bun
    - codegraph
    - context7
    - destructive-command-guard
    - gh
    - gitlab-ci-local
    - glab
    - go
    - hugo
    - incus
    - java
    - just
    - k8s
    - kotlin
    - mempalace
    - opentofu
    - pre-commit
    - pulumi
    - rtk
    - shell
    - terraform
    - uv
default_tools:
  home:
    - bun
    - codegraph
    - context7
    - destructive-command-guard
    - gh
    - gitlab-ci-local
    - glab
    - go
    - hugo
    - incus
    - just
    - k8s
    - mempalace
    - opentofu
    - pre-commit
    - rtk
    - shell
    - uv
  soprasteria:
    - codegraph
    - context7
    - destructive-command-guard
    - gitlab-ci-local
    - go
    - hugo
    - java
    - k8s
    - mempalace
    - pre-commit
    - rtk
    - shell
    - terraform
    - uv

agent_runtimes: [claude, codex, copilot]
default_agent_runtimes:
  home: [claude, copilot]
  soprasteria: [copilot]

plugins: [cave-talk, humanizer, ponytail]
default_plugins:
  home: [cave-talk, humanizer, ponytail]
  soprasteria: [cave-talk, humanizer, ponytail]
