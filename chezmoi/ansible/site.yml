# Code generated by AI (Claude Opus 5)

- name: Machine setup
  hosts: localhost
  become: true
  gather_facts: false
  vars:
    # renovate: datasource=github-tags packageName=daniel-g-carrasco/wayland-scroll-factor depName=wayland-scroll-factor
    wayland_version: 1.0.0

  tasks:
    - name: Chezmoi config
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'XDG_CONFIG_HOME') | default(lookup('env', 'HOME') ~ '/.config', true) }}/chezmoi/chezmoi.yaml"
        name: chezmoi_config
    - name: Chezmoi data
      ansible.builtin.set_fact: {"{{ item.key }}": "{{ item.value }}"}
      loop: "{{ chezmoi_config.data | dict2items }}"

    - name: Apt
      ansible.builtin.import_tasks: tasks/apt.yml
    - name: Desktop
      ansible.builtin.import_tasks: tasks/desktop.yml
      when: machine.kind == 'desktop'
    - name: Docker install
      ansible.builtin.import_tasks: tasks/docker-install.yml
      when: "'docker' in container.runtimes"
    - name: Docker remove
      ansible.builtin.import_tasks: tasks/docker-remove.yml
      when: "'docker' not in container.runtimes"
    - name: Podman install
      ansible.builtin.import_tasks: tasks/podman-install.yml
      when: "'podman' in container.runtimes"
    - name: Podman remove
      ansible.builtin.import_tasks: tasks/podman-remove.yml
      when: "'podman' not in container.runtimes"
    - name: Server
      ansible.builtin.import_tasks: tasks/server.yml
      when: machine.kind == 'server'
    - name: Apt autoremove
      ansible.builtin.apt:
        autoremove: true

  handlers:
    - name: Configure wayland-scroll-factor
      ansible.builtin.command: wsf set --scroll-vertical 0.10 --scroll-horizontal 0.10
      become: false
      changed_when: true
    - name: Integrate yubico authenticator
      ansible.builtin.command: "{{ ansible.home }}/.local/share/yubico-authenticator/desktop_integration.sh --install"
      become: false
      changed_when: true
    - name: Restart timezone consumers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: [cron, rsyslog]
