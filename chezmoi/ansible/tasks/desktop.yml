# Code generated by AI (Claude Opus 5)

- name: Package facts
  ansible.builtin.package_facts:

- name: Desktop packages
  ansible.builtin.apt:
    name: "{{ ['libreoffice'] + (['nextcloud-desktop', 'pcscd'] if profile == 'home' else []) }}"

- name: Enabled repositories
  ansible.builtin.set_fact:
    repositories: >-
      {{ repositories | rejectattr('enabled', 'defined') | list + repositories | selectattr('enabled', 'defined') | selectattr('enabled') | list }}
  vars:
    repositories:
      - name: spotify
        uris: https://repository.spotify.com
        components: non-free
        key: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc
        packages: [spotify-client]
      - name: vscode
        uris: https://packages.microsoft.com/repos/code
        components: main
        key: https://packages.microsoft.com/keys/microsoft.asc
        packages: [code]
        enabled: "{{ 'vscode' in ide }}"
      - name: brave
        uris: https://brave-browser-apt-release.s3.brave.com/
        components: main
        key: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        packages: [brave-browser]
        enabled: "{{ profile == 'home' }}"
      - name: netbird
        uris: https://pkgs.netbird.io/debian
        components: main
        key: https://pkgs.netbird.io/debian/public.key
        packages: [netbird]
        enabled: "{{ profile == 'home' }}"

- name: Repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    uris: "{{ item.uris }}"
    suites: stable
    components: "{{ item.components }}"
    signed_by: "{{ item.key }}"
    architectures: amd64
  loop: "{{ repositories }}"

- name: Repository packages
  ansible.builtin.apt:
    name: "{{ repositories | map(attribute='packages') | flatten }}"
    update_cache: true

- name: Wayland-scroll-factor
  ansible.builtin.apt:
    deb: https://github.com/daniel-g-carrasco/wayland-scroll-factor/releases/download/v{{ wayland_version }}/wayland-scroll-factor_{{ wayland_version }}-1_amd64.deb
  vars:
    installed: "{{ ansible_facts.packages['wayland-scroll-factor'] | default([]) | map(attribute='version') | first | default('') }}"
  when: installed != wayland_version ~ '-1'
  notify: Configure wayland-scroll-factor

- name: Zed
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fSL https://zed.dev/install.sh | sh # noqa: command-instead-of-module
    creates: "{{ ansible.home }}/.local/bin/zed"
    executable: /bin/bash
  become: false
  when: "'zed' in ide"

- name: Discord
  ansible.builtin.apt:
    deb: https://discord.com/api/download?platform=linux
  when: profile == 'home' and 'discord' not in ansible_facts.packages

- name: Yubico authenticator
  ansible.builtin.unarchive:
    src: https://developers.yubico.com/yubioath-flutter/Releases/yubico-authenticator-latest-linux.tar.gz
    dest: "{{ ansible.home }}/.local/share/yubico-authenticator"
    remote_src: true
    extra_opts: [--strip-components=1]
  become: false
  when: profile == 'home'
  notify: Integrate yubico authenticator
