# Code generated by AI (Claude Opus 5)

- name: Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible.codename }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg
    architectures: amd64
- name: Docker packages
  ansible.builtin.apt:
    name: [containerd.io, dbus-user-session, docker-buildx-plugin, docker-ce, docker-ce-cli, docker-ce-rootless-extras, docker-compose-plugin, passt, uidmap]
    update_cache: true

- name: Rootful docker off
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [docker.service, docker.socket]
- name: Rootful socket
  ansible.builtin.file:
    path: /var/run/docker.sock
    state: absent

- name: Subordinate ids
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ ansible.username }}:"
    line: "{{ ansible.username }}:100000:65536"
  loop: [/etc/subuid, /etc/subgid]

- name: Rootless docker
  ansible.builtin.command:
    cmd: dockerd-rootless-setuptool.sh install
    creates: "{{ ansible.home }}/.config/systemd/user/docker.service"
  become: false

- name: Linger
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible.username }}
    creates: /var/lib/systemd/linger/{{ ansible.username }}
