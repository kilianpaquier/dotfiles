# Code generated by AI (Claude Opus 5)

# read-only, runs in check mode too so the hosts replace can be previewed
- name: Current hostname
  ansible.builtin.command: hostname
  register: current_hostname
  changed_when: false
  check_mode: false
- name: Hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '(?<!\S){{ current_hostname.stdout }}(?!\S)'
    replace: "{{ machine.name }}"
  when: current_hostname.stdout != machine.name
- name: Hostname
  ansible.builtin.hostname:
    name: "{{ machine.name }}"

- name: Timezone
  community.general.timezone:
    name: "{{ ansible.timezone }}"
  notify: Restart timezone consumers

# routing peers (NetBird) and CIS hardened images (incus, proxmox) need forwarding
- name: Ipv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.forwarding
    value: "1"
    sysctl_file: /etc/sysctl.d/enabled_ipv4_forwarding.conf
