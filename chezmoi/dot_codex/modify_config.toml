{{- /* chezmoi:modify-template */ -}}

{{- $marketplaces := dict
    "mempalace" "https://github.com/mempalace/mempalace.git"
    "one-for-all" "https://github.com/kilianpaquier/ai-integration.git"
    "ponytail" "https://github.com/DietrichGebert/ponytail.git" }}
{{- $plugins := includeTemplate "enabled-plugins.json.tmpl" (merge (dict "lsps" false) .) | fromJson }}

{{- $config := dict }}
{{- if .chezmoi.stdin }}{{- $config = fromToml .chezmoi.stdin }}{{- end }}

{{- range $name, $_ := $marketplaces }}{{ $_ := unset ($config.marketplaces | default dict) $name }}{{- end }}
{{- if not $config.marketplaces }}{{ $_ := unset $config "marketplaces" }}{{- end }}

{{- range $id, $_ := includeTemplate "plugins.json.tmpl" (merge (dict "lsps" false) .) | fromJson }}
{{- $_ := unset ($config.plugins | default dict) $id }}
{{- end }}
{{- if not $config.plugins }}{{ $_ := unset $config "plugins" }}{{- end }}

{{- /* toToml (BurntSushi, no options) indents nested tables two spaces per level */ -}}
{{- with $config }}{{- regexReplaceAll "(?m)^ +" (toToml .) "" }}{{- end }}

{{- range $name, $source := $marketplaces }}

[marketplaces.{{ $name }}]
source_type = "git"
source = "{{ $source }}"
{{- end }}

{{- range $id, $enabled := $plugins }}

[plugins."{{ $id }}"]
enabled = {{ $enabled }}
{{- end }}
