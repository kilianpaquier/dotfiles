# Code generated by AI (Claude Opus 5).

schema_version: 1

id: chezmoi.exec
name: exec
version: 1.0.0
description: Interpreters and script files, code dcg cannot inspect (inline -c/-e bodies are already extracted by dcg's heredoc engine and stay out)

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
# Keywords are word-bounded, so python3 needs its own entry (python3.12 ends at the dot).
keywords:
  - bash
  - deno
  - node
  - perl
  - python
  - python3
  - ruby
  - sh
  - source
  - sudo
  - zsh
  - ./
  - ". "

destructive_patterns:
  # runs a command with elevated privileges
  - name: sudo-any
    pattern: "(?<![\\w-])sudo\\b"
    severity: critical
    description: Runs a command with elevated privileges
  # runs a shell script file
  - name: bash-script
    pattern: "(?<![\\w-])bash\\b(?: -[^c\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a shell script file
  # runs a script or inline code
  - name: deno-run
    pattern: "(?<![\\w-])deno (?:run|eval)\\b"
    severity: high
    description: Runs a script or inline code
  # runs a script file
  - name: node-script
    pattern: "(?<![\\w-])node\\b(?: -[^e\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a script file
  # runs a script file
  - name: perl-script
    pattern: "(?<![\\w-])perl\\b(?: -[^eE\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a script file
  # runs a script file or a module
  - name: python-script
    pattern: "(?<![\\w-])(?:python3(?:\\.\\d+)?|python)\\b(?: -[^c\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a script file or a module
  # runs a local executable by relative path
  - name: relative-exec
    pattern: "(?:^|['\"])(?:\\./|\\.\\./)+\\S+"
    severity: high
    description: Runs a local executable by relative path
  # runs a script file
  - name: ruby-script
    pattern: "(?<![\\w-])ruby\\b(?: -[^e\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a script file
  # runs a shell script file
  - name: sh-script
    pattern: "(?<![\\w-])sh\\b(?: -[^c\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a shell script file
  # sources a shell script into the current shell
  - name: source
    pattern: "(?:^|[\\s'\"])(?:source |\\. )\\S"
    severity: high
    description: Sources a shell script into the current shell
  # runs a shell script file
  - name: zsh-script
    pattern: "(?<![\\w-])zsh\\b(?: -[^c\\s]\\S*)* [^-\\s<]"
    severity: high
    description: Runs a shell script file
