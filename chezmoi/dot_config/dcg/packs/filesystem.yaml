# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.filesystem
name: filesystem
version: 1.2.0
description: Local file commands not covered by dcg's built-in core/system packs

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - awk
  - cp
  - gawk
  - mawk
  - mv
  - nawk
  - rm
  - sed

destructive_patterns:
  # awk writing a file or piping to a command
  - name: awk-redirect
    pattern: "(?<![\\w-])(?:gawk|mawk|nawk|awk)\\b.*(?:print|printf)\\b[^;{}]*(?:>>?|\\|)"
    severity: high
    description: awk writing a file or piping to a command
  # awk running a command or a program file dcg cannot inspect
  - name: awk-system
    pattern: "(?<![\\w-])(?:gawk|mawk|nawk|awk)\\b.*(?:system\\s*\\(|\\|\\s*getline|\\s-f\\s*\\S|\\s--file[= ])"
    severity: high
    description: awk running a command or a program file dcg cannot inspect

  # copies a file, can overwrite the destination silently
  - name: cp
    pattern: "(?<![\\w-])cp\\b"
    severity: high
    description: Copies a file, can overwrite the destination silently
  # moves a file, can overwrite the destination silently
  - name: mv
    pattern: "(?<![\\w-])mv\\b"
    severity: high
    description: Moves a file, can overwrite the destination silently
  # edits a file in place
  - name: sed-inplace
    pattern: "(?<![\\w-])sed\\b.*\\s(?:-[a-zA-Z]*i|--in-place)"
    severity: high
    description: Edits a file in place

  # dcg's core::filesystem pack already hard-blocks the dangerous forms, this catches plain rm
  # deletes a file
  - name: rm-plain
    pattern: "(?<![\\w-])rm "
    severity: high
    description: Deletes a file

# The risk in cp/mv/sed -i is a silent overwrite, so the forms that cannot overwrite
# or that keep the previous content pass without a prompt.
safe_patterns:
  # cp that never overwrites (-n), keeps a backup (-b) or targets a temp directory
  - name: cp-safe
    pattern: "(?<![\\w-])cp\\b.*(?:\\s(?:-[a-zA-Z]*[nb][a-zA-Z]*|--no-clobber|--backup(?:=\\S+)?)\\b|\\s(?:/tmp|\\$\\{?TMPDIR\\}?)/\\S*(?=$|['\"]))"
    description: cp that never overwrites (-n), keeps a backup (-b) or targets a temp directory
  # mv that never overwrites (-n), keeps a backup (-b) or targets a temp directory
  - name: mv-safe
    pattern: "(?<![\\w-])mv\\b.*(?:\\s(?:-[a-zA-Z]*[nb][a-zA-Z]*|--no-clobber|--backup(?:=\\S+)?)\\b|\\s(?:/tmp|\\$\\{?TMPDIR\\}?)/\\S*(?=$|['\"]))"
    description: mv that never overwrites (-n), keeps a backup (-b) or targets a temp directory
  # sed -i with a backup suffix keeps the original file
  - name: sed-inplace-backup
    pattern: "(?<![\\w-])sed\\b.*\\s(?:-[a-zA-Z]*i[^\\s'\"]\\S*|--in-place=\\S+)"
    description: sed -i with a backup suffix keeps the original file
