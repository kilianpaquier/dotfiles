# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.git
name: git
version: 1.1.0
description: git mutations not already covered by dcg's strict_git/core::git packs, with safe exceptions for their no-op forms

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - git

destructive_patterns:
  # changes refs, history or the working tree
  - name: git-mutating
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (add|am|apply|branch|checkout|commit|fetch|merge|mv|notes|pull|push|remote|replace|reset|restore|revert|rm|switch|tag|update-ref)\\b"
    severity: high
    description: Changes refs, history or the working tree
  # creates, applies or clears a stash
  - name: git-stash-mutating
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* stash(?: (apply|branch|clear|create|pop|push|save|store|-\\S+)|(?=$|['\"]))"
    severity: high
    description: Creates, applies or clears a stash
  # writes git config through a flag or the set/unset verb
  - name: git-config-write
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* config\\b.*(--global|--system|--add|--unset|--unset-all|--replace-all|--rename-section|--remove-section|--edit|-e\\b| set | unset )"
    severity: high
    description: Writes git config through a flag or the set/unset verb
  # writes git config through the legacy key value form
  - name: git-config-set
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* config(?: --(?:local|worktree))? [^-\\s]\\S+ \\S"
    severity: high
    description: Writes git config through the legacy key value form
  # fetches, rewires or runs code in submodules
  - name: git-submodule-write
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* submodule (absorbgitdirs|add|foreach|init|set-branch|set-url|sync|update)\\b"
    severity: high
    description: Fetches, rewires or runs code in submodules

safe_patterns:
  # read-only branch listing
  - name: git-branch-readonly
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* branch(?: (?:-a|-r|-v|-vv|--all|--remotes|--show-current))*(?: (?:-l|--list)(?: [^-\\s]\\S*)*)?(?=$|['\"])"
    description: Read-only branch listing
  # read-only remote inspection
  - name: git-remote-readonly
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* remote(?: (?:-v|--verbose))*(?: (?:show|get-url)(?: -n| --push| [^-\\s]\\S*)*)?(?=$|['\"])"
    description: Read-only remote inspection
  # read-only tag listing
  - name: git-tag-readonly
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* tag(?: (?:-l|--list)\\b|(?=$|['\"]))"
    description: Read-only tag listing
  # dry-run add/fetch/push, changes nothing
  - name: git-dry-run
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:(add|push) (-n|--dry-run)|fetch --dry-run)"
    description: Dry-run add/fetch/push, changes nothing
  # cancels or resumes an in-progress merge/rebase/cherry-pick
  - name: git-abort
    pattern: "(?<![\\w-])git\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (merge|rebase|cherry-pick) (--abort|--continue|--quit|--skip)"
    description: Cancels or resumes an in-progress merge/rebase/cherry-pick
