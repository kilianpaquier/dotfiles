# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.gitlab
name: gitlab
version: 1.2.0
description: glab CLI mutating and disabled subcommands not covered by any dcg built-in pack

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - glab

destructive_patterns:
  # disabled glab subcommand
  - name: glab-disabled
    pattern: "(?<![\\w-])glab\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (artifact-registry|cluster|dependency-firewall|duo|mcp|orbit|runner-controller|stack) "
    severity: critical
    description: Disabled glab subcommand
  # mutating glab subcommand
  - name: glab-mutating
    pattern: "(?<![\\w-])glab\\b(?: -\\S+(?: [^-\\s]\\S*)?)* \\S+(?: \\S+)? (?:[a-z]+-)?(add|approve|archive|cancel|checkout|clear-cache|close|comment|copy|create|delete|develop|disable|download|edit|enable|exec|fork|import|install|link|lock|login|logout|mark-template|merge|mirror|note|pin|ready|rebase|refresh|remove|rename|reopen|rerun|retry|review|revoke|rotate|run|set|setup-git|subscribe|switch|sync|todo|transfer|trigger|unarchive|unlink|unlock|unpin|unsubscribe|update|upgrade|upload)\\b"
    severity: high
    description: Mutating glab subcommand
  # glab api call with a mutating HTTP method, a request body or a GraphQL mutation
  - name: glab-api-write
    pattern: "(?<![\\w-])glab\\b(?: -\\S+(?: [^-\\s]\\S*)?)* api\\b.*(?:(?:-X\\s*|--method(?:=|\\s+))(?i:post|put|patch|delete)\\b|\\s(?:-f|-F|--field|--raw-field|--input)(?:=|\\s)|\\bmutation\\b)"
    severity: high
    description: glab api call with a mutating HTTP method, a request body or a GraphQL mutation
  # glab api call defaulting to or explicitly using GET
  - name: glab-api-read
    pattern: "(?<![\\w-])glab\\b(?: -\\S+(?: [^-\\s]\\S*)?)* api "
    severity: low
    description: glab api call defaulting to or explicitly using GET
