# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.package_managers
name: package-managers
version: 1.1.0
description: npm/pnpm/bun/uv/pipx/nix mutations not already covered by dcg's built-in package_managers pack (publish is covered for npm/pnpm, the others aren't covered at all)

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - bun
  - bunx
  - nix
  - npm
  - npx
  - pipx
  - pnpm
  - uv
  - uvx

destructive_patterns:
  # The x alias only counts right after the tool, otherwise a flag value named x (--prefix x) matches.
  # runs an arbitrary package binary
  - name: bun-exec
    pattern: "(?<![\\w-])bun(?: x(?: |$)|\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (exec|create)\\b)"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: bunx
    pattern: "(?<![\\w-])bunx\\b"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: npm-exec
    pattern: "(?<![\\w-])npm(?: x(?: |$)|\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:(exec|create)\\b|init(?: -\\S+)* [^-\\s]))"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: npx
    pattern: "(?<![\\w-])npx\\b"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: pnpm-dlx
    pattern: "(?<![\\w-])pnpm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (dlx|exec|create)\\b"
    severity: critical
    description: Runs an arbitrary package binary
  # downloads and runs an arbitrary package
  - name: uv-tool-run
    pattern: "(?<![\\w-])uv tool run\\b"
    severity: critical
    description: Downloads and runs an arbitrary package
  # downloads and runs an arbitrary package
  - name: uvx
    pattern: "(?<![\\w-])uvx\\b"
    severity: critical
    description: Downloads and runs an arbitrary package
  # downloads and runs an arbitrary package
  - name: pipx-run
    pattern: "(?<![\\w-])pipx run\\b"
    severity: critical
    description: Downloads and runs an arbitrary package
  # fetches and runs an arbitrary derivation
  - name: nix-run
    pattern: "(?<![\\w-])nix run\\b"
    severity: critical
    description: Fetches and runs an arbitrary derivation

  # mutates bun dependencies or registry state
  - name: bun-write
    pattern: "(?<![\\w-])bun\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (a|add|i|init|install|link|pm cache rm|publish|remove|rm|unlink|up|update|upgrade)\\b"
    severity: high
    description: Mutates bun dependencies or registry state
  # destructive package script
  - name: bun-run-destructive
    pattern: "(?<![\\w-])bun\\b(?: -\\S+(?: [^-\\s]\\S*)?)* run\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive package script
  # runs inline code or a script file dcg cannot inspect
  - name: bun-script
    pattern: "(?<![\\w-])bun\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:-e |--eval |--print |\\S+\\.[cm]?[jt]sx?\\b)"
    severity: high
    description: Runs inline code or a script file dcg cannot inspect
  # mutates npm dependencies
  - name: npm-write
    pattern: "(?<![\\w-])npm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (add|ci|cit|dedupe|ddp|i|init|install|install-ci-test|install-test|it|link|ln|prune|r|rm|un|uninstall|unlink|up|update|upgrade)\\b"
    severity: high
    description: Mutates npm dependencies
  # destructive package script
  - name: npm-run-destructive
    pattern: "(?<![\\w-])npm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:run|run-script|rum|urn)\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive package script
  # mutates pnpm dependencies
  - name: pnpm-write
    pattern: "(?<![\\w-])pnpm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (add|dedupe|i|import|init|install|install-test|it|link|ln|prune|remove|rm|un|uninstall|unlink|up|update|upgrade)\\b"
    severity: high
    description: Mutates pnpm dependencies
  # destructive package script
  - name: pnpm-run-destructive
    pattern: "(?<![\\w-])pnpm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* run\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive package script
  # runs a script or command in the project environment
  - name: uv-run
    pattern: "(?<![\\w-])uv run\\b"
    severity: high
    description: Runs a script or command in the project environment

  # runs a package script
  - name: bun-run
    pattern: "(?<![\\w-])bun\\b(?: -\\S+(?: [^-\\s]\\S*)?)* run\\b"
    severity: medium
    description: Runs a package script
  # runs a package script
  - name: npm-run
    pattern: "(?<![\\w-])npm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:run|run-script|rum|urn|start|stop|test|t|restart)\\b"
    severity: medium
    description: Runs a package script
  # runs a package script
  - name: pnpm-run
    pattern: "(?<![\\w-])pnpm\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:run|start|test|t)\\b"
    severity: medium
    description: Runs a package script
