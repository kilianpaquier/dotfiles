[settings]
disable_backends = ["asdf", "conda", "pkgx", "spm", "s3", "ubi", "vfox"]
disable_default_registry = true
minimum_release_age = "5d"
trusted_config_paths = ["~/workspaces", "~/.local/share/chezmoi", "~/.local/share/chezmoi.worktrees"]

[settings.npm]
shell_out = true

[tool_alias]
bash-language-server = "npm:bash-language-server"
codebase-memory-mcp = "github:DeusData/codebase-memory-mcp[matching=codebase-memory-mcp-ui]"
codegraph = "github:colbymchenry/codegraph"
context7 = "npm:ctx7"
context7-mcp = "npm:@upstash/context7-mcp"
dart-sass = "github:sass/dart-sass"
destructive-command-guard = "github:Dicklesworthstone/destructive_command_guard"
incus = "github:lxc/incus[matching=incus.,rename_exe=incus]"
kotlin-lsp = "github:Kotlin/kotlin-lsp"
mempalace = "pipx:mempalace"
tofu-ls = "github:opentofu/tofu-ls"

[env]
CAVEMAN_DEFAULT_MODE = "ultra"
PONYTAIL_DEFAULT_MODE = "ultra"
