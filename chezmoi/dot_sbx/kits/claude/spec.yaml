# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json

schemaVersion: "3"
kind: set
displayName: claude dotfiles
description: claude configuration, the harness is mounted by ~/.sbxenv.yaml
version: 0.0.0
licenses: [MIT]

capabilities:
  - group:
      name: plugins-off
      capabilities:
        - type: com.docker.sandbox/lifecycle@1
          config:
            files:
              - path: /etc/claude-code/managed-settings.d/50-dotfiles.json
                content: |
                  {"enabledPlugins": {"mempalace@mempalace": false}}

  - group:
      name: github
      optional: true
      capabilities:
        - type: com.docker.sandbox/credential@1
          description: GitHub token for gh, from sbx secret set github
          config:
            service: github
            phase: runtime
            apiKey:
              name: GH_TOKEN
              proxyManaged: true
              inject:
                - { domain: api.github.com, header: Authorization, format: "Bearer %s" }
                - { domain: github.com, scheme: basic, username: x-access-token }
                - { domain: raw.githubusercontent.com, header: Authorization, format: "Bearer %s" }

kits:
  - ref: docker.io/sbx/claude:latest
