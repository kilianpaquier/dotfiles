schemaVersion: "3"
kind: set
displayName: tools
description: mise with the host's tools and CA certificates from ~/.sbxenv.yaml mounts, and glab
version: 0.0.0
licenses: [MIT]

capabilities:
  - group:
      name: ca-certificates
      capabilities:
        - type: com.docker.sandbox/lifecycle@1
          config:
            install:
              # ~/.sbxenv.yaml mounts the host CA certificates under /usr/local/share/ca-certificates/host.
              - command: update-ca-certificates
                description: Trust the host CA certificates, for TLS-inspecting proxies

  # - group:
  #     name: plugins
  #     capabilities:
  #       - type: com.docker.sandbox/network-policy@1
  #         config:
  #           runtime:
  #             allow:
  #               - context7.com
  #               - github.com
  #               - registry.npmjs.org

  - group:
      name: mise
      capabilities:
        - type: com.docker.sandbox/host-mount@1
          description: mise tools, installed once and shared by every sandbox of this kit
          config:
            path: /home/agent/.local/share/mise
        # - type: com.docker.sandbox/network-policy@1
        #   config:
        #     install:
        #       allow:
        #         - api.github.com
        #         - github.com
        #         - mise.jdx.dev
        #         - mise.run
        #         - objects.githubusercontent.com
        #         - release-assets.githubusercontent.com
        #     runtime:
        #       allow:
        #         - api.github.com
        #         - archive.apache.org
        #         - cdn.dl.k8s.io
        #         - codeload.github.com
        #         - dl.google.com
        #         - dl.k8s.io
        #         - files.pythonhosted.org
        #         - get.helm.sh
        #         - github.com
        #         - go.dev
        #         - mise-java.jdx.dev
        #         - mise-versions.jdx.dev
        #         - nodejs.org
        #         - objects.githubusercontent.com
        #         - proxy.golang.org
        #         - pypi.org
        #         - raw.githubusercontent.com
        #         - registry.npmjs.org
        #         - registry.opentofu.org
        #         - registry.terraform.io
        #         - release-assets.githubusercontent.com
        #         - releases.hashicorp.com
        #         - repo.maven.apache.org
        #         - sum.golang.org
        #         - tuf-repo-cdn.sigstore.dev
        - type: com.docker.sandbox/lifecycle@1
          config:
            install:
              # Do not use docker.io/sbx/mise, since it pins mise 2026.5.2.
              - command: curl -fsSL https://mise.run | sh
                user: "1000"
                env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
                description: Install mise into ~/.local/bin
              # Same two lines as symlinks/.profile: shims on PATH, then mise env without its PATH.
              - command:
                  - sh
                  - -c
                  - printf '%s\n' 'export PATH="$HOME/.local/share/mise/shims:$PATH"' 'eval "$(mise env | grep -v PATH=)"' >> "$BASH_ENV"
                user: "1000"
                env: [BASH_ENV]
                description: Load mise shims and env in the agent, which sbx starts through BASH_ENV
            startup:
              - command: /home/agent/.local/bin/mise install -y
                user: "1000"
                background: true
                env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
                description: Install missing tools into the shared directory, a no-op once installed
            # The mise config comes from the host mounts in ~/.sbxenv.yaml, minus the tools that only make sense on the host.
            files:
              - path: /home/agent/.config/mise/conf.d/20-sbx.toml
                content: |
                  [settings]
                  disable_tools = ["agentsview", "destructive-command-guard", "gh", "glab", "mempalace"]

kits:
  - ref: docker.io/sbx/gitlab:1.118.0
