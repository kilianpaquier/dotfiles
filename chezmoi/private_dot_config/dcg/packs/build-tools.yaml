# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.build_tools
name: build-tools
version: 1.1.0
description: go and build/task runners (just, make, task, mise, mvn); tofu/terraform is left to dcg's built-in infrastructure pack

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - go
  - just
  - make
  - mise
  - mvn
  - task

destructive_patterns:
  # wipes the shared module download cache for every project
  - name: go-clean-modcache
    pattern: "(?<![\\w-])go\\b(?: -\\S+(?: [^-\\s]\\S*)?)* clean\\b.*\\s-{1,2}modcache\\b"
    severity: critical
    description: Wipes the shared module download cache for every project
  # runs code, fetches deps, generates files, clears a cache or writes the go env
  - name: go-exec
    pattern: "(?<![\\w-])go\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (run|get|generate|install|fix|work|clean|env -w|env -u)\\b"
    severity: high
    description: Runs code, fetches deps, generates files, clears a cache or writes the go env
  # fetches dependencies or rewrites go.mod
  - name: go-mod-write
    pattern: "(?<![\\w-])go\\b(?: -\\S+(?: [^-\\s]\\S*)?)* mod (download|edit|init)\\b"
    severity: high
    description: Fetches dependencies or rewrites go.mod

  # destructive just target
  - name: just-destructive
    pattern: "(?<![\\w-])just\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive just target
  # destructive make target
  - name: make-destructive
    pattern: "(?<![\\w-])make\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive make target
  # destructive mise task
  - name: mise-run-destructive
    pattern: "(?<![\\w-])mise\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:run|r)\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive mise task
  # publishes artifacts or wipes the local maven repository
  - name: mvn-destructive
    pattern: "(?<![\\w-])mvn\\b.*\\s(?:deploy|release:\\S+|purge-local-repository)\\b"
    severity: high
    description: Publishes artifacts or wipes the local maven repository
  # destructive task target
  - name: task-destructive
    pattern: "(?<![\\w-])task\\b.*?\\s\\S*(clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive task target

  # runs a justfile recipe
  - name: just-run
    pattern: "(?<![\\w-])just\\b(?: -\\S+(?: [^-\\s]\\S*)?)* [^-\\s]"
    severity: medium
    description: Runs a justfile recipe
  # runs a Makefile target
  - name: make-run
    pattern: "(?<![\\w-])make\\b(?: -\\S+(?: [^-\\s]\\S*)?)* [^-\\s]"
    severity: medium
    description: Runs a Makefile target
  # runs a mise task
  - name: mise-run
    pattern: "(?<![\\w-])mise\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (?:run|r)\\b"
    severity: medium
    description: Runs a mise task
  # runs a maven phase or goal
  - name: mvn-run
    pattern: "(?<![\\w-])mvn\\b(?: -\\S+(?: [^-\\s]\\S*)?)* [^-\\s]"
    severity: medium
    description: Runs a maven phase or goal
  # runs a Taskfile task
  - name: task-run
    pattern: "(?<![\\w-])task\\b(?: -\\S+(?: [^-\\s]\\S*)?)* [^-\\s]"
    severity: medium
    description: Runs a Taskfile task
