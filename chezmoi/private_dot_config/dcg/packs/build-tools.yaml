# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.build_tools
name: build-tools
version: 1.2.0
description: Destructive targets of just, make, task, mise and mvn.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - just
  - make
  - mise
  - mvn
  - task

destructive_patterns:
  # destructive just target, as a token of its own so --no-clean passes
  - name: just-destructive
    pattern: "(?<![\\w-])just\\b[^;&|\\n]*?\\s(?:(?!-)[^\\s;&|]*(?:apply|clean|delete|deploy|destroy|drop|install|migrate|nuke|prune|publish|purge|push|release|reset|rollback|teardown|undeploy|uninstall|upload|wipe)|(?:down|remove|rm)(?=\\s|$))"
    severity: high
    description: Destructive just target
  # destructive make target
  - name: make-destructive
    pattern: "(?<![\\w-])make\\b[^;&|\\n]*?\\s(?:(?!-)[^\\s;&|]*(?:apply|clean|delete|deploy|destroy|drop|install|migrate|nuke|prune|publish|purge|push|release|reset|rollback|teardown|undeploy|upload|uninstall|wipe)|(?:down|remove|rm)(?=\\s|$))"
    severity: high
    description: Destructive make target
  # destructive mise task
  - name: mise-run-destructive
    pattern: "(?<![\\w-])mise\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:run|r)\\b[^;&|\\n]*?\\s(?:(?!-)[^\\s;&|]*(?:apply|clean|delete|deploy|destroy|drop|install|migrate|nuke|prune|publish|purge|push|release|reset|rollback|teardown|undeploy|upload|uninstall|wipe)|(?:down|remove|rm)(?=\\s|$))"
    severity: high
    description: Destructive mise task
  # publishes artifacts or wipes the local maven repository
  - name: mvn-destructive
    pattern: "(?<![\\w-])mvn\\b[^;&|\\n]*\\s(?:deploy|release:\\S+|purge-local-repository)\\b"
    severity: high
    description: Publishes artifacts or wipes the local maven repository
  # destructive task target
  - name: task-destructive
    pattern: "(?<![\\w-])task\\b[^;&|\\n]*?\\s(?:(?!-)[^\\s;&|]*(?:apply|clean|delete|deploy|destroy|drop|install|migrate|nuke|prune|publish|purge|push|release|reset|rollback|teardown|undeploy|upload|uninstall|wipe)|(?:down|remove|rm)(?=\\s|$))"
    severity: high
    description: Destructive task target

  # runs a justfile recipe
  - name: just-run
    pattern: "(?<![\\w-])just\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+[^-\\s]"
    severity: medium
    description: Runs a justfile recipe
  # runs a Makefile target
  - name: make-run
    pattern: "(?<![\\w-])make\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+[^-\\s]"
    severity: medium
    description: Runs a Makefile target
  # runs a mise task
  - name: mise-run
    pattern: "(?<![\\w-])mise\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:run|r)\\b"
    severity: medium
    description: Runs a mise task
  # runs a maven phase or goal
  - name: mvn-run
    pattern: "(?<![\\w-])mvn\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+[^-\\s]"
    severity: medium
    description: Runs a maven phase or goal
  # runs a Taskfile task
  - name: task-run
    pattern: "(?<![\\w-])task\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+[^-\\s]"
    severity: medium
    description: Runs a Taskfile task
