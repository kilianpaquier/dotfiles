# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.containers
name: containers
version: 1.0.0
description: |
  Options of docker and podman that drop the container isolation or mount the host.
  Both run outside the sandbox.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - docker
  - podman

destructive_patterns:
  # a container option that drops the isolation from the host
  - name: container-escape
    pattern: "(?<![\\w-])(?:docker|podman)\\b[^;&|\\n]*\\s(?:--privileged|--pid[=\\s]host|--userns[=\\s]host|--ipc[=\\s]host|--net(?:work)?[=\\s]host|--cap-add|--device|--security-opt[=\\s]\\S*(?:unconfined|label[=:]disable))(?![\\w-])"
    severity: high
    description: Drops the isolation of the container from the host

  # a bind mount of the host root, the home directory or a system directory (-v, --volume)
  - name: container-bind-host
    pattern: "(?<![\\w-])(?:docker|podman)\\b[^;&|\\n]*\\s(?:-v|--volume)(?:=|\\s*)[\\\"']?(?!(?:~/workspaces|/home/[^/\\s\"']+/workspaces|/tmp)(?:[/:,\\s\"']|$))(?:/|~|\\$HOME|\\$\\{HOME\\})"
    severity: high
    description: Bind mounts a host directory other than the workspaces

  # a bind mount of the host root, the home directory or a system directory (--mount)
  - name: container-mount-host
    pattern: "(?<![\\w-])(?:docker|podman)\\b[^;&|\\n]*\\s--mount(?:=|\\s+)[\\\"']?[^\\s\\\"']*?(?:source|src)=(?!(?:~/workspaces|/home/[^/\\s\"']+/workspaces|/tmp)(?:[/:,\\s\"']|$))(?:/|~|\\$HOME|\\$\\{HOME\\})"
    severity: high
    description: Bind mounts a host directory other than the workspaces
