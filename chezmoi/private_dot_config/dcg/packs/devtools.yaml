# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.devtools
name: devtools
version: 1.1.0
description: ctx7 disabled subcommands and chezmoi subcommands tiered by what they actually do

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - chezmoi
  - ctx7

destructive_patterns:
  # disabled ctx7 subcommand
  - name: ctx7-disabled
    pattern: "(?<![\\w-])ctx7 (login|logout|remove|setup|uninstall|upgrade)"
    severity: critical
    description: Disabled ctx7 subcommand

  # permanently deletes managed files, the source repo, or drops tracking
  - name: chezmoi-destructive
    pattern: "(?<![\\w-])chezmoi\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (destroy|purge|remove|rm|unmanage)"
    severity: critical
    description: Permanently deletes managed files, the source repo, or drops tracking
  # writes to the target machine, the source repo, or chezmoi's own config
  - name: chezmoi-mutating
    pattern: "(?<![\\w-])chezmoi\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (add|apply|cd|edit|edit-config|edit-config-template|edit-encrypted|execute-template|forget|generate|import|init|manage|merge|merge-all|re-add|update|upgrade)"
    severity: high
    description: Writes to the target machine, the source repo, or chezmoi's own config

safe_patterns:
  # read-only inspection, no side effects
  - name: chezmoi-readonly
    pattern: "(?<![\\w-])chezmoi\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (cat|cat-config|data|diff|doctor|dump|dump-config|help|ignored|list|managed|source-path|status|target-path|unmanaged|verify)"
    description: Read-only inspection, no side effects
