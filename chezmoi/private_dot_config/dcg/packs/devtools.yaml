# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.devtools
name: devtools
version: 1.2.0
description: Mutating chezmoi subcommands and disabled ctx7 subcommands.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - chezmoi
  - ctx7

# The chezmoi flags that take a separate value are listed, so a value is never read as the subcommand
destructive_patterns:
  # disabled ctx7 subcommand
  - name: ctx7-disabled
    pattern: "(?<![\\w-])ctx7\\s+(?:login|logout|remove|setup|uninstall|upgrade)\\b"
    severity: critical
    description: Disabled ctx7 subcommand

  # permanently deletes managed files, the source repo, or drops tracking
  - name: chezmoi-destructive
    pattern: "(?<![\\w-])chezmoi(?:\\s+(?:(?:-[DScWo]|--(?:cache|config|config-format|destination|mode|output|override-data|persistent-state|source|working-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[DScWo]|--(?:cache|config|config-format|destination|mode|output|override-data|persistent-state|source|working-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:destroy|purge|remove|rm|unmanage)(?![\\w-])"
    severity: critical
    description: Permanently deletes managed files, the source repo, or drops tracking

  # writes to the target machine, the source repo, or chezmoi's own config, or runs a command through chezmoi
  - name: chezmoi-mutating
    pattern: "(?<![\\w-])chezmoi(?:\\s+(?:(?:-[DScWo]|--(?:cache|config|config-format|destination|mode|output|override-data|persistent-state|source|working-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[DScWo]|--(?:cache|config|config-format|destination|mode|output|override-data|persistent-state|source|working-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:add|apply|cd|chattr|decrypt|edit|edit-config|edit-config-template|edit-encrypted|encrypt|execute-template|forget|generate|git|import|init|manage|merge|merge-all|re-add|secret|state|update|upgrade)(?![\\w-])"
    severity: high
    description: Writes to the target machine, the source repo, or chezmoi's own config, or runs a command through chezmoi

safe_patterns:
  # read-only inspection, no side effects
  - name: chezmoi-readonly
    pattern: "(?<![\\w-])chezmoi(?:\\s+(?:(?:-[DScWo]|--(?:cache|config|config-format|destination|mode|output|override-data|persistent-state|source|working-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[DScWo]|--(?:cache|config|config-format|destination|mode|output|override-data|persistent-state|source|working-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:cat|cat-config|data|diff|doctor|dump|dump-config|help|ignored|list|managed|source-path|status|target-path|unmanaged|verify)(?![\\w-])"
    description: Read-only inspection, no side effects
