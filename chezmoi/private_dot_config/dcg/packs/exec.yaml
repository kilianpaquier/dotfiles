# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.exec
name: exec
version: 1.1.0
description: Privilege escalation through sudo and its equivalents.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - doas
  - pkexec
  - run0
  - su
  - sudo

destructive_patterns:
  # runs a command with elevated privileges
  - name: sudo-any
    pattern: "(?<![\\w-])(?:sudo|doas|pkexec|run0|su)(?![\\w-])"
    severity: critical
    description: Runs a command with elevated privileges

# a data command that only names the tool passes, with no substitution, redirect or pipe
safe_patterns:
  # reads or prints text that names the tool
  - name: sudo-data-context
    pattern: "^\\s*(?:rtk\\s+)?(?:grep|egrep|fgrep|rg|ag|ack|man|which|type|whereis|apropos|apt-cache|echo|printf|cat|head|tail|less|bat|wc|ls)\\b[^;&|<>`$()\\n]*$"
    description: Reads or prints text that names the tool
