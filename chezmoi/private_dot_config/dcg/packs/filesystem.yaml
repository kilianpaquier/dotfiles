# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.filesystem
name: filesystem
version: 1.3.0
description: Deletions that the sandbox does not bound, such as recursive and glob removals.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - find
  - rm
  - shred
  - xargs

# core::filesystem already blocks the dangerous forms of rm, these catch the rest
destructive_patterns:
  # deletes a directory tree, unless every target sits under /tmp or $TMPDIR
  - name: rm-recursive
    pattern: "(?<![\\w-])rm\\b(?!(?:\\s+(?:-[^\\s;&|]+|(?:\"?\\$\\{?TMPDIR\\}?\"?|/tmp)/(?![^\\s;&|]*\\.\\.)[^\\s;&|]+))+\\s*(?:$|[;&|)]))[^;&|\\n]*\\s(?:-[A-Za-z]*[rR][A-Za-z]*|--recursive)(?![\\w-])"
    severity: high
    description: Deletes a directory tree
  # deletes a shell-chosen set of files, unless every target sits under /tmp or $TMPDIR
  - name: rm-glob
    pattern: "(?<![\\w-])rm\\b(?!(?:\\s+(?:-[^\\s;&|]+|(?:\"?\\$\\{?TMPDIR\\}?\"?|/tmp)/(?![^\\s;&|]*\\.\\.)[^\\s;&|]+))+\\s*(?:$|[;&|)]))[^;&|\\n]*\\s[^\\s;&|]*[*?\\[]"
    severity: high
    description: Deletes a shell-chosen set of files
  # deletes what find selects
  - name: find-delete
    pattern: "(?<![\\w-])find\\b[^;&|\\n]*\\s(?:-delete(?![\\w-])|-exec(?:dir)?\\s+(?:\\S*/)?(?:rm|shred|unlink)(?![\\w-]))"
    severity: high
    description: Deletes what find selects
  # deletes what xargs is fed
  - name: xargs-rm
    pattern: "(?<![\\w-])xargs\\b[^;&|\\n]*\\s(?:\\S*/)?(?:rm|shred|unlink)(?![\\w-])"
    severity: high
    description: Deletes what xargs is fed
  # overwrites a file so its content cannot be recovered
  - name: shred
    pattern: "(?<![\\w-])shred(?![\\w-])"
    severity: high
    description: Overwrites a file so its content cannot be recovered
