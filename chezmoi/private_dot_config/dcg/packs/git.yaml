# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.git
name: git
version: 0.0.0
description: |
  Every git verb that is not read-only, and the options that make git run a command.
  The read-only forms of branch, remote, tag, stash and config pass, and so do plain clone and archive.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - git

destructive_patterns:
  # deletes or moves tracked files, not recoverable through git status or a soft reset alone
  - name: git-rm-mv
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:mv|rm)(?![\\w-])"
    severity: critical
    description: git rm and git mv are denied, use plain rm and mv instead

  # rewrites what a commit SHA resolves to for anyone who fetches it, same blast radius as filter-branch
  - name: git-replace
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+replace(?![\\w-])"
    severity: critical
    description: Rewrites what a commit resolves to

  # a -c key, a --config-env or an --exec-path that makes git run a command (alias, ssh, pager, hooks, credential helper, filter, driver)
  - name: git-config-exec
    pattern: "(?i)(?<![\\w.-])git\\b[^;&|\\n]*?\\s(?:-c\\s*[\\\"']?(?:alias\\.[^=\\s]*=[\\\"']?!|core\\.(?:askpass|attributesfile|editor|excludesfile|fsmonitor|gitproxy|hookspath|pager|sshcommand)|credential\\.[^=\\s]*helper|diff\\.[^=\\s]*(?:external|textconv)|filter\\.[^=\\s]+\\.(?:clean|process|smudge)|gpg\\.[^=\\s]*program|include(?:if\\.[^=\\s]+)?\\.path|merge\\.[^=\\s]+\\.driver|protocol\\.[^=\\s]*allow|safe\\.directory|sequence\\.editor|url\\.[^=\\s]+\\.insteadof|http\\.(?:cookiefile|proxy|sslcainfo|sslcert|sslkey))|--config-env[=\\s]|--exec-path[=\\s])"
    severity: critical
    description: Makes git run a command through a -c key, --config-env or --exec-path

  # an environment variable that makes git run a command (ssh, askpass, pager, editor, external diff)
  - name: git-env-exec
    pattern: "(?i)(?<![\\w-])GIT_(?:ALTERNATE_OBJECT_DIRECTORIES|ASKPASS|CONFIG_(?:COUNT|GLOBAL|KEY_\\d+|PARAMETERS|SYSTEM|VALUE_\\d+)|EDITOR|EXEC_PATH|EXTERNAL_DIFF|PAGER|PROXY_COMMAND|SEQUENCE_EDITOR|SSH|SSH_COMMAND|TEMPLATE_DIR)="
    severity: critical
    description: Makes git run a command through an environment variable

  # a diff or log writing to a file chosen by the caller
  - name: git-output-file
    pattern: "(?<![\\w.-])git\\b[^;&|\\n]*\\s--output(?:=|\\s)"
    severity: high
    description: Writes to a file chosen by the caller

  # git grep opening matches in a command
  - name: git-grep-pager
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+grep\\b[^;&|\\n]*\\s(?:-O|--open-files-in-pager)"
    severity: high
    description: Opens matches in a command

  # read-only forms live in each pattern's lookahead, since a safe pattern only clears a command it opens
  # any other git verb that is not read-only changes refs, history, the working tree or reaches the network
  - name: git-mutating
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?!(?:status|log|diff|show|blame|annotate|rev-parse|rev-list|ls-files|ls-tree|ls-remote|describe|shortlog|grep|cat-file|show-ref|name-rev|merge-base|for-each-ref|count-objects|diff-tree|diff-files|diff-index|check-ignore|check-attr|check-ref-format|var|version|help|whatchanged|range-diff|show-branch|cherry|verify-commit|verify-tag|get-tar-commit-id|request-pull|archive|clone|add|am|branch|cherry-pick|config|fetch|merge|notes|push|rebase|reflog|remote|revert|stash|submodule|tag|worktree)(?![\\w-]))[a-z][\\w-]*"
    severity: high
    description: Any other git verb that is not read-only

  # writes git config, reading a key or listing passes
  - name: git-config-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+config(?![\\w-])(?!(?:\\s+--(?:local|global|system|worktree|show-origin|show-scope))*\\s+(?:(?:--(?:get|get-all|get-regexp|get-urlmatch|list)|-l)(?![\\w-])|[a-z][\\w.-]*(?=\\s*(?:\\d*>>?&?\\s*[^\\s;&|)]+\\s*)*(?:$|[;&|)]))))"
    severity: high
    description: Writes git config

  # rewrites history or the working tree, cancelling an in-progress one with --abort or --quit passes
  - name: git-history-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:am|cherry-pick|merge|rebase|revert)(?![\\w-])(?!\\s+(?:--abort|--quit)(?![\\w-]))"
    severity: high
    description: Merges, rebases, cherry-picks, reverts or applies patches

  # changes notes, listing and showing pass
  - name: git-notes-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+notes(?![\\w-])(?!\\s+(?:list|show)(?![\\w-])|(?=\\s*(?:\\d*>>?&?\\s*[^\\s;&|)]+\\s*)*(?:$|[;&|)])))"
    severity: high
    description: Adds, edits or removes notes

  # changes branches and tags, listing passes
  - name: git-ref-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:branch(?![\\w-])(?!(?:\\s+(?:-a|-r|-v|-vv|--all|--remotes|--show-current))*(?:\\s+(?:-l|--list)(?:\\s+[^-;&|\\s][^;&|\\s]*)*)?(?=\\s*(?:\\d*>>?&?\\s*[^\\s;&|)]+\\s*)*(?:$|[;&|)])))|tag(?![\\w-])(?!\\s+(?:-l|--list)(?![\\w-])|(?=\\s*(?:\\d*>>?&?\\s*[^\\s;&|)]+\\s*)*(?:$|[;&|)]))))"
    severity: high
    description: Creates, renames or deletes branches and tags

  # drops reflog entries, which recovery relies on
  - name: git-reflog-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+reflog\\s+(?:delete|drop|expire)(?![\\w-])"
    severity: high
    description: Deletes or expires reflog entries

  # changes remotes, listing and inspecting pass
  - name: git-remote-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+remote(?![\\w-])(?!(?:\\s+(?:-v|--verbose))*(?:\\s+(?:show|get-url)(?:\\s+[^;&|\\s]+)*)?(?=\\s*(?:\\d*>>?&?\\s*[^\\s;&|)]+\\s*)*(?:$|[;&|)])))"
    severity: high
    description: Adds, changes or removes remotes

  # stages files or reaches the network, a dry run passes
  - name: git-stage-sync
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:(?:add|push)(?![\\w-])(?!\\s+(?:-n|--dry-run)(?![\\w-]))|fetch(?![\\w-])(?!\\s+--dry-run(?![\\w-])))"
    severity: high
    description: Stages files, or fetches or pushes over the network

  # changes stashes or the working tree, listing and showing pass
  - name: git-stash-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+stash(?![\\w-])(?!\\s+(?:list|show)(?![\\w-]))"
    severity: high
    description: Creates, applies or drops a stash

  # fetches, rewires or runs code in submodules, status and summary pass
  - name: git-submodule-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+submodule(?![\\w-])(?!\\s+(?:status|summary)(?![\\w-])|(?=\\s*(?:\\d*>>?&?\\s*[^\\s;&|)]+\\s*)*(?:$|[;&|)])))"
    severity: high
    description: Fetches, rewires or runs code in submodules

  # changes worktrees, listing passes
  - name: git-worktree-write
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+worktree(?![\\w-])(?!\\s+list(?![\\w-]))"
    severity: high
    description: Adds, moves or removes worktrees

  # a plain clone, archive or ls-remote passes, an option that runs a command or writes elsewhere does not
  - name: git-transport-exec
    pattern: "(?<![\\w.-])git(?:\\s+(?:(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Cc]|--(?:attr-source|config-env|git-dir|namespace|super-prefix|work-tree))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:archive|clone|ls-remote)(?![\\w-])(?=[^;&|\\n]*\\s(?:-o|-u|--config|--exec|--output|--separate-git-dir|--template|--upload-pack)(?:[=\\s]|$))"
