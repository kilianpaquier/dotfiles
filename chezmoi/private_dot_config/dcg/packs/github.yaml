# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.github
name: github
version: 1.3.0
description: Mutating and disabled gh subcommands, which no dcg built-in pack covers.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - gh

destructive_patterns:
  # disabled gh subcommand
  - name: gh-disabled
    pattern: "(?<![\\w-])gh(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:agent-task|attestation|codespace|copilot|preview|skill)(?![\\w-])"
    severity: critical
    description: Disabled gh subcommand

  # mutating gh subcommand, with the flags allowed between the words, a download into the cwd passes
  - name: gh-mutating
    pattern: "(?<![\\w-])gh(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+[a-z][\\w-]*(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*(?:\\s+[a-z][\\w-]*(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*)??\\s+(?:[a-z]+-)?(?:add|approve|archive|cancel|checkout|clear-cache|clone|close|comment|copy|create|delete|develop|disable|download(?![\\w-])(?=[^;&|\\n]*\\s(?:-D|-O|--dir|--output)(?:[=\\s]|$))|edit|enable|exec|fork|import|install|link|lock|login|logout|mark-template|merge|mirror|note|pin|ready|rebase|refresh|remove|rename|reopen|rerun|retry|review|revoke|rotate|run|set|setup-git|subscribe|switch|sync|todo|transfer|trigger|unarchive|unlink|unlock|unpin|unsubscribe|update|upgrade|upload)(?![\\w-])"
    severity: high
    description: Mutating gh subcommand

  # gh api call with a mutating HTTP method, a request body without an explicit GET, or a GraphQL mutation
  - name: gh-api-write
    pattern: "(?<![\\w-])gh(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+api\\b(?:[^;&|\\n]*?(?:\\s(?:-X|--method)(?:=|\\s*)(?i:post|put|patch|delete)\\b|\\bmutation\\b)|(?![^;&|\\n]*\\s(?:-X|--method)(?:=|\\s*)(?i:get)\\b)[^;&|\\n]*?\\s(?:-[fF](?:\\S|\\s)|--(?:field|raw-field|input)(?:=|\\s)))"
    severity: high
    description: gh api call with a mutating HTTP method, a request body or a GraphQL mutation

  # printing the gh token
  - name: gh-token
    pattern: "(?<![\\w-])gh(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+auth(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:token(?![\\w-])|status\\b[^;&|\\n]*\\s(?:-t|--show-token)(?![\\w-]))"
    severity: high
    description: Printing the gh token

  # gh api call defaulting to or explicitly using GET
  - name: gh-api-read
    pattern: "(?<![\\w-])gh(?:\\s+(?:(?:-R|--(?:hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-R|--(?:hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+api\\s"
    severity: low
    description: gh api call defaulting to or explicitly using GET
