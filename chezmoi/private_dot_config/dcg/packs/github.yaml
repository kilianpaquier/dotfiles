# Code generated by AI (Claude Sonnet 5).

schema_version: 1

id: chezmoi.github
name: github
version: 1.2.0
description: gh CLI mutating and disabled subcommands not covered by any dcg built-in pack

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - gh

destructive_patterns:
  # disabled gh subcommand
  - name: gh-disabled
    pattern: "(?<![\\w-])gh\\b(?: -\\S+(?: [^-\\s]\\S*)?)* (agent-task|attestation|codespace|copilot|preview|skill) "
    severity: critical
    description: Disabled gh subcommand
  # mutating gh subcommand
  - name: gh-mutating
    pattern: "(?<![\\w-])gh\\b(?: -\\S+(?: [^-\\s]\\S*)?)* \\S+(?: \\S+)? (?:[a-z]+-)?(add|approve|archive|cancel|checkout|clear-cache|close|comment|copy|create|delete|develop|disable|download|edit|enable|exec|fork|import|install|link|lock|login|logout|mark-template|merge|mirror|note|pin|ready|rebase|refresh|remove|rename|reopen|rerun|retry|review|revoke|rotate|run|set|setup-git|subscribe|switch|sync|todo|transfer|trigger|unarchive|unlink|unlock|unpin|unsubscribe|update|upgrade|upload)\\b"
    severity: high
    description: Mutating gh subcommand
  # gh api call with a mutating HTTP method, a request body or a GraphQL mutation
  - name: gh-api-write
    pattern: "(?<![\\w-])gh\\b(?: -\\S+(?: [^-\\s]\\S*)?)* api\\b.*(?:(?:-X\\s*|--method(?:=|\\s+))(?i:post|put|patch|delete)\\b|\\s(?:-f|-F|--field|--raw-field|--input)(?:=|\\s)|\\bmutation\\b)"
    severity: high
    description: gh api call with a mutating HTTP method, a request body or a GraphQL mutation
  # gh api call defaulting to or explicitly using GET
  - name: gh-api-read
    pattern: "(?<![\\w-])gh\\b(?: -\\S+(?: [^-\\s]\\S*)?)* api "
    severity: low
    description: gh api call defaulting to or explicitly using GET
