# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.gitlab
name: gitlab
version: 0.0.0
description: Mutating and disabled glab subcommands, which no dcg built-in pack covers.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - glab

destructive_patterns:
  # disabled glab subcommand
  - name: glab-disabled
    pattern: "(?<![\\w-])glab(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:artifact-registry|cluster|dependency-firewall|duo|mcp|orbit|runner-controller|stack)(?![\\w-])"
    severity: critical
    description: Disabled glab subcommand

  # mutating glab subcommand, with the flags allowed between the words, a download into the cwd passes
  - name: glab-mutating
    pattern: "(?<![\\w-])glab(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+[a-z][\\w-]*(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*(?:\\s+[a-z][\\w-]*(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*)??\\s+(?:[a-z]+-)?(?:add|approve|archive|cancel|checkout|clear-cache|clone|close|comment|copy|create|delete|develop|disable|download(?![\\w-])(?=[^;&|\\n]*\\s(?:-D|-O|--dir|--output)(?:[=\\s]|$))|edit|enable|exec|fork|import|install|link|lock|login|logout|mark-template|merge|mirror|note|pin|ready|rebase|refresh|remove|rename|reopen|rerun|retry|review|revoke|rotate|run|set|setup-git|subscribe|switch|sync|todo|transfer|trigger|unarchive|unlink|unlock|unpin|unsubscribe|update|upgrade|upload)(?![\\w-])"
    severity: high
    description: Mutating glab subcommand

  # glab api call with a mutating HTTP method, a request body without an explicit GET, or a GraphQL mutation
  - name: glab-api-write
    pattern: "(?<![\\w-])glab(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+api\\b(?:[^;&|\\n]*?(?:\\s(?:-X|--method)(?:=|\\s*)(?i:post|put|patch|delete)\\b|\\bmutation\\b)|(?![^;&|\\n]*\\s(?:-X|--method)(?:=|\\s*)(?i:get)\\b)[^;&|\\n]*?\\s(?:-[fF](?:\\S|\\s)|--(?:field|raw-field|input)(?:=|\\s)))"
    severity: high
    description: glab api call with a mutating HTTP method, a request body or a GraphQL mutation

  # printing the glab token
  - name: glab-token
    pattern: "(?<![\\w-])glab(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+auth(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+(?:token(?![\\w-])|status\\b[^;&|\\n]*\\s(?:-t|--show-token)(?![\\w-]))"
    severity: high
    description: Printing the glab token

  # glab api call defaulting to or explicitly using GET
  - name: glab-api-read
    pattern: "(?<![\\w-])glab(?:\\s+(?:(?:-[Rg]|--(?:group|hostname|repo))(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+)|\\s+(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))|(?!(?:-[Rg]|--(?:group|hostname|repo))(?=[\\s=]|$))-{1,2}[A-Za-z][\\w-]*(?:=(?:(?:[^\\s\"'\\\\]|\\\\.|\"[^\"]*\"|'[^']*')+))?))*\\s+api\\s"
    severity: low
    description: glab api call defaulting to or explicitly using GET
