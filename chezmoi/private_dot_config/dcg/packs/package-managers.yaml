# Code generated by AI (Claude Code).

schema_version: 1

id: chezmoi.package_managers
name: package-managers
version: 0.0.0
description: |
  Installs and package execution for npm, pnpm, bun, go, uv, pip, pipx, cargo, gem, mise and nix.
  The built-in package_managers pack covers publishing for some of them.

# gates pattern evaluation: dcg skips this pack entirely unless one of these appears in the command
keywords:
  - bun
  - bunx
  - cargo
  - gem
  - go
  - mise
  - nix
  - nix-channel
  - nix-collect-garbage
  - nix-env
  - nix-store
  - npm
  - npx
  - pip
  - pip3
  - pipx
  - pnpm
  - python
  - python3
  - uv
  - uvx

destructive_patterns:
  # runs an arbitrary package binary, where x only counts right after the tool
  - name: bun-exec
    pattern: "(?<![\\w-])bun(?:\\s+x(?:\\s|$)|\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:exec|create)\\b)"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: bunx
    pattern: "(?<![\\w-])bunx\\b"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: npm-exec
    pattern: "(?<![\\w-])npm(?:\\s+x(?:\\s|$)|\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:(?:exec|create)\\b|init(?:\\s+-\\S+)*\\s+[^-\\s]))"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: npx
    pattern: "(?<![\\w-])npx\\b"
    severity: critical
    description: Runs an arbitrary package binary
  # runs an arbitrary package binary
  - name: pnpm-dlx
    pattern: "(?<![\\w-])pnpm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:dlx|exec|create)\\b"
    severity: critical
    description: Runs an arbitrary package binary
  # downloads and runs an arbitrary package
  - name: uv-tool-run
    pattern: "(?<![\\w-])uv\\s+tool\\s+run\\b"
    severity: critical
    description: Downloads and runs an arbitrary package
  # downloads and runs an arbitrary package
  - name: uvx
    pattern: "(?<![\\w-])uvx\\b"
    severity: critical
    description: Downloads and runs an arbitrary package
  # downloads and runs an arbitrary package
  - name: pipx-run
    pattern: "(?<![\\w-])pipx\\s+run\\b"
    severity: critical
    description: Downloads and runs an arbitrary package
  # fetches and runs an arbitrary derivation
  - name: nix-run
    pattern: "(?<![\\w-])nix\\s+run\\b"
    severity: critical
    description: Fetches and runs an arbitrary derivation

  # wipes the shared module download cache for every project
  - name: go-clean-modcache
    pattern: "(?<![\\w-])go\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+clean\\b[^;&|\\n]*\\s-{1,2}modcache\\b"
    severity: critical
    description: Wipes the shared module download cache for every project

  # mutates bun dependencies or registry state
  - name: bun-write
    pattern: "(?<![\\w-])bun\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:a|add|i|init|install|link|pm\\s+cache\\s+rm|publish|remove|rm|unlink|up|update|upgrade)\\b"
    severity: high
    description: Mutates bun dependencies or registry state
  # destructive package script
  - name: bun-run-destructive
    pattern: "(?<![\\w-])bun\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+run\\b[^;&|\\n]*?\\s\\S*(?:clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive package script
  # mutates npm dependencies
  - name: npm-write
    pattern: "(?<![\\w-])npm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:add|ci|cit|dedupe|ddp|i|init|install|install-ci-test|install-test|it|link|ln|prune|r|rm|un|uninstall|unlink|up|update|upgrade)\\b"
    severity: high
    description: Mutates npm dependencies
  # destructive package script
  - name: npm-run-destructive
    pattern: "(?<![\\w-])npm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:run|run-script|rum|urn)\\b[^;&|\\n]*?\\s\\S*(?:clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive package script
  # mutates pnpm dependencies
  - name: pnpm-write
    pattern: "(?<![\\w-])pnpm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:add|dedupe|i|import|init|install|install-test|it|link|ln|prune|remove|rm|un|uninstall|unlink|up|update|upgrade)\\b"
    severity: high
    description: Mutates pnpm dependencies
  # destructive package script
  - name: pnpm-run-destructive
    pattern: "(?<![\\w-])pnpm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+run\\b[^;&|\\n]*?\\s\\S*(?:clean|delete|deploy|destroy|drop|install|publish|purge|push|release|reset|uninstall|wipe)"
    severity: high
    description: Destructive package script
  # runs a script or command in the project environment, after syncing it (which installs)
  - name: uv-run
    pattern: "(?<![\\w-])uv\\s+run\\b"
    severity: high
    description: Runs a script or command in the project environment, after syncing it

  # installs, removes or downloads python packages
  - name: pip-write
    pattern: "(?<![\\w-])(?:pip3?|python3?\\s+-m\\s+pip)\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:download|install|uninstall|wheel)\\b"
    severity: high
    description: Installs, removes or downloads python packages
  # installs, removes or upgrades pipx applications
  - name: pipx-write
    pattern: "(?<![\\w-])pipx\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:ensurepath|inject|install|install-all|reinstall|reinstall-all|uninstall|uninstall-all|upgrade|upgrade-all)\\b"
    severity: high
    description: Installs, removes or upgrades pipx applications
  # changes the uv project, its environment, its tools or its interpreters
  - name: uv-write
    pattern: "(?<![\\w-])uv\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:add|build|init|lock|publish|remove|sync|cache\\s+(?:clean|prune)|pip\\s+(?:compile|install|sync|uninstall)|python\\s+(?:install|uninstall|upgrade)|self\\s+update|tool\\s+(?:install|uninstall|upgrade))\\b"
    severity: high
    description: Changes the uv project, its environment, its tools or its interpreters
  # installs, removes or publishes rust crates
  - name: cargo-write
    pattern: "(?<![\\w-])cargo\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:add|fetch|install|login|owner|publish|remove|uninstall|update|vendor|yank)\\b"
    severity: high
    description: Installs, removes or publishes rust crates
  # installs, removes or publishes ruby gems
  - name: gem-write
    pattern: "(?<![\\w-])gem\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:cleanup|install|push|uninstall|update|yank)\\b"
    severity: high
    description: Installs, removes or publishes ruby gems
  # installs, upgrades or removes mise tools, or changes mise settings and trust
  - name: mise-write
    pattern: "(?<![\\w-])mise\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:alias\\s+set|exec|generate|i|implode|install|link|lock|pin|plugins?\\s+(?:add|install|remove|uninstall|update)|prune|rm|self-update|set|settings\\s+set|sync|trust|u|uninstall|unpin|unset|up|upgrade|use|x)\\b"
    severity: high
    description: Installs, upgrades or removes mise tools, or changes mise settings and trust
  # installs, builds or removes nix packages
  - name: nix-write
    pattern: "(?<![\\w-])(?:nix\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:build|copy|develop|env|flake\\s+(?:lock|update)|profile\\s+(?:install|remove|rollback|upgrade|wipe-history)|shell|store\\s+(?:delete|gc|repair))|nix-(?:channel(?!\\s+--list(?![\\w-]))|collect-garbage|env(?!\\s+(?:-q|--query)(?![\\w-]))|store(?!\\s+(?:-q|--query|--verify-path|--read-log|-l)(?![\\w-]))))\\b"
    severity: high
    description: Installs, builds or removes nix packages

  # installs a binary or fetches a dependency, which the agent leaves to the user
  - name: go-install-get
    pattern: "(?<![\\w-])go\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:get|install)\\b"
    severity: high
    description: Installs a binary or fetches a dependency
  # writes the go env file
  - name: go-env-write
    pattern: "(?<![\\w-])go\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+env\\s+-[wu]\\b"
    severity: high
    description: Writes the go env file
  # fetches dependencies or rewrites go.mod
  - name: go-mod-write
    pattern: "(?<![\\w-])go\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+mod\\s+(?:download|edit|init)\\b"
    severity: high
    description: Fetches dependencies or rewrites go.mod

  # runs a package script
  - name: bun-run
    pattern: "(?<![\\w-])bun\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+run\\b"
    severity: medium
    description: Runs a package script
  # runs a package script
  - name: npm-run
    pattern: "(?<![\\w-])npm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:run|run-script|rum|urn|start|stop|test|t|restart)\\b"
    severity: medium
    description: Runs a package script
  # runs a package script
  - name: pnpm-run
    pattern: "(?<![\\w-])pnpm\\b(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+(?:run|start|test|t)\\b"
    severity: medium
    description: Runs a package script
